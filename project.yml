name: Nosh
options:
  bundleIdPrefix: local.nosh
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Nosh:
    type: application
    platform: iOS
    sources: [Nosh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.nosh.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take a food photo to estimate its calories on your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nosh
  NoshTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NoshTests]
    dependencies:
      - target: Nosh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NoshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoshUITests]
    dependencies:
      - target: Nosh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nosh:
    build:
      targets:
        Nosh: all
    test:
      targets: [NoshTests, NoshUITests]
