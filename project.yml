name: TinyLunch
options:
  bundleIdPrefix: com.rgllm
  deploymentTarget:
    iOS: '27.0'
  xcodeVersion: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: F86KMMECSR
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '27'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Release:
      VALIDATE_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO
targets:
  TinyLunch:
    type: application
    platform: iOS
    sources: [TinyLunch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rgllm.tinylunch
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: '27'
        MARKETING_VERSION: '1.0.0'
        INFOPLIST_KEY_NSCameraUsageDescription: Take a food photo to estimate its calories on your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: TinyLunch
        INFOPLIST_KEY_CFBundleName: TinyLunch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Rogério Moreira. All rights reserved."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  TinyLunchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TinyLunchTests]
    dependencies:
      - target: TinyLunch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rgllm.tinylunch.tests
        CODE_SIGN_STYLE: Automatic
  TinyLunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TinyLunchUITests]
    dependencies:
      - target: TinyLunch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rgllm.tinylunch.uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: TinyLunch
schemes:
  TinyLunch:
    build:
      targets:
        TinyLunch: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TinyLunchTests, TinyLunchUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
